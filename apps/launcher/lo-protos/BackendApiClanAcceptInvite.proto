syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Backend.Web.Protos";
package MistProto;

message BackendApiClanAcceptInviteRequest
{
	int64 invite_id = 1;
}

message BackendApiClanAcceptInviteResponse
{
	int64 invite_id = 1;
	int64 clan_id = 2;
	int64 character_id = 3;
}
