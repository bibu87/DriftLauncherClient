syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Backend.Web.Protos";
package MistProto;

// Needs to be an authorized account, needs to set the CharacterId in the header.
message BackendApiPlayerDeleteCharacterRequest
{

}

message BackendApiPlayerDeleteCharacterResponse
{
	message Success
	{
		int64 character_id = 1;
	}
	
	// Normal errors will appear here, authorization errors will be bad request errors.
	enum ErrorState 
	{	
		AlreadyDeleted = 0;
	}

	oneof result
	{
		Success success = 1;
		ErrorState error = 2;
	}
}
