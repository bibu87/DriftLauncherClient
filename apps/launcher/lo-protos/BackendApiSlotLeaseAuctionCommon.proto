syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Backend.Web.Protos";
package MistProto;

message BackendApiSlotLeaseAuctionWindow
{
	int64 id = 1;
	int64 realm_tile_id = 2;

	int64 soft_close_date = 3;
	int64 hard_close_date = 4;
	bool is_closed = 5;

	int64 start_date = 6;
	int64 end_date = 7;

	int32 total_slots = 8;
	int32 player_slots = 9;

	int64 total_bids_amount = 10;
	int64 player_bids_amount = 11;
	
	bool player_can_bid = 12;
}
