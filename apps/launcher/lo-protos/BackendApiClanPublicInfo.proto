syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Backend.Web.Protos";
package MistProto;

message BackendApiClanQueryBasicRequest
{
	repeated int64 clan_ids = 1;
}

message BackendApiClanQueryBasicResponse
{
	message ClanPublicInfo {
		int64 clan_id = 1;
		string name = 2;
		string color_id = 3;
		string emblem_id = 4;	
	}

	repeated ClanPublicInfo items = 1;
}