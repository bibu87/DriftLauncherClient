syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Game.Protos";
import "Items.proto";
import "Time.proto";
package MistProto;

message WalkerClaimingComponent
{
	enum Status
	{
		UNDEPLOYED = 0;
		reserved 1;
		ACTIVE = 2;
		DESTROYED = 3;
		ACTIVATING = 4;
		reserved 5;
	}

	reserved 1;
	bool deployed_deprecated = 2;
	reserved 3;
	reserved 4;
	int64 created_date = 5;
	Status status = 6;
	bool deployment_in_progress = 7;
	int32 activation_time_seconds = 8;
	TimeOffset time_offset = 9;
	float walk_distance = 10;
}

message ClaimManager
{
	message StoredItem
	{
		Item item = 1;
		int32 count = 2;
	}
	
	message CharacterInformation
	{
		int64 character_id = 1;
		int64 last_murdered_date = 2;
		int32 harvested_amount = 3;
		int64 last_harvested_date = 4;
	}

	repeated StoredItem stored_items = 1;
	repeated CharacterInformation character_informations = 2;
}

message PoachingComponent
{
	bool active = 1;
	int32 activation_seconds_left = 2;
	TimeOffset time_offset = 3;
}
