syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Backend.Web.Protos";
package MistProto;

message BackendApiClanAddRankRequest
{
	string name = 1;
	int32 priority = 2;
	int64 permissions = 3;
	string icon = 4;
}

message BackendApiClanAddRankResponse
{
	int64 rank_id = 1;
}
