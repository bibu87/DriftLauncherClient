syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Game.Protos";
import "Items.proto";
import "Time.proto";
package MistProto;

message TradeStation
{
	message VaultItem
	{
		Item item = 1;
		int32 count = 2;
	}
	
	message VaultContent
	{
		int64 character_id = 1;
		int32 money_deposits = 2;
		repeated VaultItem items = 3;
	}

	message AuctionData
	{
		int32 highest_bid = 1;
		float time = 2;
		Item item = 3;
		int32 quantity = 4;
		int64 winner = 5;
		repeated int64 participants = 6;
	}

	message TradeHistoryEntry
	{
		int64 character_id = 1;
		Item item = 2;
		int32 count = 3;
		int32 total_price = 4;
		int64 time = 5;
		bool is_buy_order = 6;
	}

	message TradeHistory
	{
		int64 creator_id = 1;
		repeated TradeHistoryEntry entries = 2;
	}

	repeated VaultContent vault = 1;
	int32 vault_tax = 2;
	reserved 3 to 4;
	repeated AuctionData auction = 5;
	int64 new_auction_time = 6;
	repeated TradeHistory trade_history = 7;
}

message Trader
{
	message TraderItem
	{
		Item item = 1;
		int32 count = 2;
	}

	message TraderOffer
	{
		Item item = 1;
		int32 count = 2;
		int32 price = 3;
	}

	
	float depleting_seconds = 1;
	repeated TraderOffer purchasable_item = 2;
	repeated TraderOffer sellable_item = 3;
	repeated TraderItem container_item = 4;
	string merchant_name = 5;
	TimeOffset time_offset = 6;
}