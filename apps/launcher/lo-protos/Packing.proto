syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Game.Protos";
import "BaseTypes.proto";
import "Actor.proto";
import "Time.proto";
package MistProto;

message Packing
{
	message PackedPart
	{
		string item_template = 1;
		repeated Transform relative_transforms = 2;
	}

	bool is_packed_DEPRECATED = 1;
	bool is_single_structure_part_packed_DEPRECATED = 2;
	float weight = 3;
	repeated PackedPart packed_parts = 4;
	repeated Actor packed_actors = 5;
	int64 packed_opaque_owner_id = 6;
	uint32 packing_state = 7;
	TimeOffset time_offset = 8;
	float packed_time = 9;
}

message TradePacking
{
	float used_time = 1;
	float bought_time = 2;
}