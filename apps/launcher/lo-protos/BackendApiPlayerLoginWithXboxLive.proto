syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Backend.Web.Protos";
import "BackendApiPlayerLoginCommon.proto";
package MistProto;

message BackendApiPlayerLoginWithXboxLiveRequest
{
	string unique_net_id = 1;
	string name = 2;
	string xsts_token = 3;
	bool create_new_session = 4;
}

message BackendApiPlayerLoginWithXboxLiveResponse
{
	reserved 1 to 9;	
	BackendApiPlayerLoginResultData result = 10;
}
