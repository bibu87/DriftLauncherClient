syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Game.Protos";
import "Time.proto";
package MistProto;

message Character
{
	reserved 1;
	bool is_downed = 2;
	string downed_instigator_guid = 3;
	float downed_time_elapsed = 4;
	float downed_duration = 5;
	TimeOffset time_offset = 6;
}

message Player
{
	string carried_player_guid = 1;
	string unique_net_id = 2;
	reserved 3;
	int64 character_id = 4;
}

message Tombstone
{
	string dead_player_name = 1;
}
