syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Backend.Web.Protos";
package MistProto;

message BackendApiTilePlayersRequest
{
	uint32 ActivePlayerCount = 7;
	int32 ActiveReservedPlayerCount = 13;

	repeated uint64 character_ids_connected_since_last_ping = 8;
	repeated uint64 character_ids_disconnected_since_last_ping = 14;
}

message BackendApiTilePlayersResponse
{
}
