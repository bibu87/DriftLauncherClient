syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Backend.Web.Protos";
package MistProto;

message BackendApiMigrationGetWalkerPreferencesRequest
{
}

message BackendApiMigrationGetWalkerPreferencesResponse
{
	message PreferredWalker
	{
		reserved 1;
		bool is_personal = 2;
		reserved 3;
		string class_path = 4;
		reserved 5;
		int64 realm_tile_id = 6;
		reserved 7;
		int64 walker_id = 8;
		bool is_packed = 9;
		string name = 10;
	}

	repeated PreferredWalker walkers = 1;
	bool has_clan = 2;
	bool can_manage_clan_preferences = 3;
}
