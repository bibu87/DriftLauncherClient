syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Backend.Web.Protos";
import "BackendApiOffMapLobbyData.proto";
import "BackendApiCommon.proto";
package MistProto;

message BackendApiOffMapLobbyQueryRequest
{
}

message BackendApiOffMapLobbyQueryResponse
{
	reserved 2;
	
	oneof result
	{
		BackendApiOffMapLobbyData data = 1;
		int64 queue_id = 3;
		BackendApiRealmAccessDeniedData realm_access_denied = 4;
	}
}
