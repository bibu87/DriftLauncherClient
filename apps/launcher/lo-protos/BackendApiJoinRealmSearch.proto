syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Backend.Web.Protos";
import "BackendApiCommon.proto";
package MistProto;

message BackendApiJoinRealmSearchRequest
{
	enum Provider
	{
		ANY_PROVIDER = 0;
		OFFICIAL = 1;
		PRIVATE = 2;
	}
	
	enum Status
	{
		ANY_STATUS = 0;
		OFFLINE = 1;
		ONLINE = 2;
	}
	
	enum RestrictedAccess
	{
		ANY_RESTRICTED_ACCESS = 0;
		NO_RESTRICTED_ACCESS = 1;
		HAS_RESTRICTED_ACCESS = 2;
	}
	
	enum Character
	{
		ANY_CHARACTER = 0;
		NO_CHARACTER = 1;
		HAS_CHARACTER = 2;
	}

	string name = 1;
	
	Provider provider = 2;
	repeated string region_keys = 3;
	repeated BackendApiGamePlatform platforms = 4;
	
	Status status = 5;
	RestrictedAccess restricted_access = 6;
	Character character = 7;
}

message BackendApiJoinRealmSearchResponse
{
	message RealmData
	{
		int64 id = 1;
		string name = 2;
		
		bool is_official = 3;
		string region_key = 4;
		BackendApiGamePlatform platform = 5;
		
		bool is_online = 6;
		string message = 7;
		
		int64 character_id = 8;
		
		int32 size = 9;
		int32 clan_cap = 10;
		reserved 11;
		int64 start_date = 12;
		int64 end_date = 13;
		
		int32 players = 14;
		int32 max_players = 15;
		
		bool has_password = 16;
		bool has_allowlist = 17;

		string description = 18;
	}

	repeated RealmData items = 1;
}
