syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Game.Protos";
import "Items.proto";
import "Time.proto";
package MistProto;

message PlayerRelicHunter
{
	message Offer
	{
		string guid = 1;
		Item item = 2;
		int32 count = 3;
		int32 price = 4;
	}
	
	TimeOffset time_offset = 1;
	
	float offers_refresh_time_left = 2;
	repeated Offer offers = 3;
}
