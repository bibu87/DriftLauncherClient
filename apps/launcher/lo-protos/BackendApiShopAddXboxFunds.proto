syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Backend.Web.Protos";
package MistProto;

message BackendApiShopAddXboxFundsRequest
{
	string consumable_id = 1;
	int32 amount = 2;
}

message BackendApiShopAddXboxFundsResponse
{
	oneof result
	{
		bool success = 1;
	}
}
