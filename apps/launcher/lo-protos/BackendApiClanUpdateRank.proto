syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Backend.Web.Protos";
package MistProto;

message BackendApiClanUpdateRankRequest
{
	int64 rank_id = 1;
	string name = 2;
	int32 priority = 3;
	int64 permissions = 4;
	string icon = 5;
}

message BackendApiClanUpdateRankResponse
{
}
