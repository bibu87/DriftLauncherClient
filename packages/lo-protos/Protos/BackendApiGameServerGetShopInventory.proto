syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Backend.Web.Protos";
package MistProto;

message BackendApiGameServerGetShopInventoryRequest
{
	string unique_net_id = 1;
}

message BackendApiGameServerGetShopInventoryResponse
{
	message Consumable
	{
		int32 quantity = 1;
	}

	message Item
	{
		string identifier = 1;
		
		oneof type
		{
			bool durable = 2;
			Consumable consumable = 3;
		}
	}
	
	string unique_net_id = 1;
	repeated Item items = 2;
}
