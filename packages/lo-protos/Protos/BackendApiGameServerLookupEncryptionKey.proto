syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Backend.Web.Protos";
package MistProto;

message BackendApiGameServerLookupEncryptionKeyRequest
{
	string token = 1;
}

message BackendApiGameServerLookupEncryptionKeyResponse
{
	oneof result
	{
		bool invalid_token = 1;
		bytes encryption_key = 2;
	}
}
