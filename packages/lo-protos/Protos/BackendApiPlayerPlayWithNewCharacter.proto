syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Backend.Web.Protos";
import "BackendApiCommon.proto";
package MistProto;

message BackendApiPlayerPlayWithNewCharacterRequest
{
	oneof spawn
	{
		int64 realm_tile_id = 1;
		int64 region_id = 2;
	}
}

message BackendApiPlayerPlayWithNewCharacterResponse
{
	oneof result
	{
		int64 queue_identifier = 1;
		BackendApiRealmAccessDeniedData realm_access_denied = 2;
	}
}
