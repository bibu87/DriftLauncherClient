syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Backend.Web.Protos";
package MistProto;

message BackendApiShopSteamInitCurrencyBundleMtxRequest
{
	int64 currency_bundle_id = 1;
	string language = 2;
	string description = 3;
}

message BackendApiShopSteamInitCurrencyBundleMtxResponse
{
	message SuccessData
	{
		uint64 order_id = 1;
	}
	
	message SteamErrorData
	{
		int64 code = 1;
		string description = 2;
	}

	oneof result
	{
		SuccessData success = 1;
		SteamErrorData steam_error = 2;
		bool invalid_currency_bundle = 3;
	}
}
