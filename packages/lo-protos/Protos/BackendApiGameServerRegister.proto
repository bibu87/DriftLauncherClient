syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Backend.Web.Protos";
package MistProto;

message BackendApiGameServerRegisterRequest
{
	string provider_key = 3;
	string customer_key = 7;

	string identifier = 9;
	int32 port = 2;

	string region_key = 1;
	string version = 4;
	int32 slots = 8;

	string description = 5;
	string management_url = 6;
	
	bool use_server_address_as_connection_string = 10;
}

message BackendApiGameServerRegisterResponse
{
	string token = 1;
	string liveserver_cert = 2;
}
