syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Backend.Web.Protos";
package MistProto;

message BackendApiStatisticsTrackMetric
{
	string name = 1;
	double value = 2;
}

message BackendApiStatisticsTrackEvent
{
	message EventProperty
	{
		string name = 1;
		string value = 2;
	}

	message EventMetric
	{
		string name = 1;
		double value = 2;
	}

	string name = 1;
	repeated EventMetric metrics = 2;
	repeated EventProperty properties = 3;
}

// Tracks all statistics provided.
message BackendApiStatisticsTrackRequest
{
	repeated BackendApiStatisticsTrackMetric metrics = 1;
	repeated BackendApiStatisticsTrackEvent events = 2;
}

message BackendApiStatisticsTrackResponse
{
}
