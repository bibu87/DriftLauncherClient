syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Backend.Web.Protos";
package MistProto;

message BackendApiPlayerGetCharacterListRequest
{
}

message BackendApiPlayerGetCharacterListResponse
{
	message ItemData
	{
		int64 realm_id = 1;
		string realm_name = 2;
		int64 character_id = 3;
		string character_name = 4;
	}

	repeated ItemData items = 1;
}
