syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Game.Protos";
import "Items.proto";
package MistProto;

message Container
{
	message Slot
	{
		int32 index = 1;
		int32 count = 2;
		Item item = 3;
	}

	int32 capacity = 1;
	reserved 2;
	repeated Slot slots = 3;
	bool remote_crafting = 4;
}
