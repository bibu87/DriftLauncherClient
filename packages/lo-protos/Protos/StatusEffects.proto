syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Game.Protos";
import "Time.proto";
package MistProto;

message StatusEffectPlayer
{
	message ActiveStatusEffect
	{
		string effect = 1;
		float start_time = 2;
		float duration = 3;
		uint64 id = 4;
		float magnitude = 5;
		float accumulated_magnitude_time = 6;
		uint32 quality = 7;
	}

	repeated ActiveStatusEffect active_status_effects = 1;
	uint64 current_id = 2;
	TimeOffset time_offset = 3;
}
