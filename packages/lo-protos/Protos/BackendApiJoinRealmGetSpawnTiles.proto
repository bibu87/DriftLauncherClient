syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Backend.Web.Protos";
import "BackendApiCommon.proto";
package MistProto;

message BackendApiJoinRealmGetSpawnTilesRequest
{
	int64 realm_id = 1;
	int64 region_id = 2;
}

message BackendApiJoinRealmGetSpawnTilesResponse
{
	message Tile
	{
		int64 id = 1;
		string name = 2;
		int32 player_count = 3;
		int32 max_slots = 4;
		BackendApiGamePlatform platform = 5;
	}

	repeated Tile tiles = 1;
}
