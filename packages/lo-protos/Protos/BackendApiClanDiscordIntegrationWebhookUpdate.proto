syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Backend.Web.Protos";
package MistProto;

// Requires player with authorized character, with founder rank.
message BackendApiClanDiscordIntegrationWebhookUpdateRequest
{
	string url = 1;
}

message BackendApiClanDiscordIntegrationWebhookUpdateResponse
{
	message Success
	{
		
	}
	
	enum ErrorState 
	{	
		InvalidURL_Host = 0;
		InvalidURL_WebhookID = 1;
		InvalidURL_WebHookToken = 2;
	}

	oneof result
	{
		Success success = 1;
		ErrorState error = 2;
	}
}
