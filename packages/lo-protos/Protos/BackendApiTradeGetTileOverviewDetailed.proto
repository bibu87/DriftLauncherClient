syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Backend.Web.Protos";
import "Items.proto";
package MistProto;

// This request allows a player to see a simplified view of trading in the tile with the designated ID.
message BackendApiTradeGetTileOverviewDetailedRequest 
{
	int64 tile_id = 1;
}

// Requires: Authorized Character
message BackendApiTradeGetTileOverviewDetailedResponse 
{
	message TradeItem
	{
		Item item = 1;
		float average_buy_unit_price = 2;
		float average_sell_unit_price = 3;
		int64 demand = 4;
		int64 supply = 5;
		int64 supply_orders_count = 6;
		int64 demand_orders_count = 7;
		float best_buy_unit_price = 8;
		float best_sell_unit_price = 9;
	}
	
	int64 tile_id = 1;
	int64 realm_id = 2;
	repeated TradeItem trades = 3;
}
