syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Backend.Web.Protos";
package MistProto;

message BackendApiVoiceChatJoinTileChannelRequest
{
	string unique_net_id = 1;
	int32 max_range = 2;
	int32 clamping_distance = 3;
	float rolloff = 4;
	int32 distance_model = 5;
}

message BackendApiVoiceChatJoinTileChannelResponse
{
	string channel = 1;
	string token = 2;
}
