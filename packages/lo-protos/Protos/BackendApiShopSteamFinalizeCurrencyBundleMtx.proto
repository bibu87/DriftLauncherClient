syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Backend.Web.Protos";
package MistProto;

message BackendApiShopSteamFinalizeCurrencyBundleMtxRequest
{
	uint64 order_id = 1;
	bool authorized = 2;
}

message BackendApiShopSteamFinalizeCurrencyBundleMtxResponse
{
	message SteamErrorData
	{
		int64 code = 1;
		string description = 2;
	}
	
	oneof result
	{
		bool success = 1;
		SteamErrorData steam_error = 2;
	}
}
