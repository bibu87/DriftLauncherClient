syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Backend.Web.Protos";
package MistProto;

message BackendApiRealmGetMapPortalsRequest
{
	int64 realm_id = 1;
	int64 version = 2;
}

message BackendApiRealmGetMapPortalsResponse
{
	message ItemData
	{
		int64 id = 1;
		int64 source_tile_id = 2;
		int32 source_tile_direction = 3;
		int64 target_tile_id = 4;
		int32 target_tile_direction = 5;
		int64 open_time = 6;
		int64 close_time = 7;
	}
	
	int64 version = 1;
	bool is_delta = 2;
	repeated ItemData items = 3;
	repeated int64 deleted = 4;
}
