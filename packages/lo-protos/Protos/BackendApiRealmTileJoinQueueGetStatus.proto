syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Backend.Web.Protos";
package MistProto;

message BackendApiRealmTileJoinQueueGetStatusRequest
{
	int64 identifier = 1;
	repeated int64 change_tracking_ids = 2;
}

message BackendApiRealmTileJoinQueueGetStatusResponse
{
	message ChangeState
	{
		int64 tracking_id = 1;
		bool applied = 2;
	}

	message Queued
	{
		int32 position = 1;
		int64 estimated_waiting_time = 2;
		bool can_evade = 3;
		bool is_online = 4;
	}

	message Connect
	{
		string connection_string = 1;
	}

	message Canceling
	{
		bool requested_by_user = 1;
		bool is_evading = 2;
	}

	message Canceled
	{
		bool requested_by_user = 1;
		bool was_evaded = 2;
	}

	int64 identifier = 1;
	repeated ChangeState changeStates = 3;

	oneof status
	{
		Queued queued = 4;
		Connect connect = 5;
		Canceling canceling = 9;
		Canceled canceled = 6;
		bool joined = 7;
	}
}
