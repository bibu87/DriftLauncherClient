syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Backend.Web.Protos";
import "BaseTypes.proto";
import "BackendApiCommon.proto";
package MistProto;

message BackendApiOffMapLobbyTravelRequest
{
	// Leave at default value in order to travel to the tile that the crew or character is already parked on.
	int64 target_realm_tile_id = 1;
	int32 target_direction = 2;
	repeated IntVector2D ordered_travel_path = 4;
}

message BackendApiOffMapLobbyTravelResponse
{
	reserved 1;
	reserved 2;
	reserved 3;
	reserved 5;
	
	oneof result
	{
		int64 queue_id = 4;
		BackendApiRealmAccessDeniedData realm_access_denied = 6;
	}
}
