syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Backend.Web.Protos";
import "BackendApiNameCheckCommon.proto";
package MistProto;

message BackendApiClanUpdateRequest
{
	string name = 1;
}

message BackendApiClanUpdateResponse
{
	oneof result
	{
		bool success = 1;
		BackendApiInvalidNameMessage error = 2;
	}
}
