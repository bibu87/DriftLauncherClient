syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Game.Protos";
import "Time.proto";
package MistProto;

message Foliage
{
	message Instance
	{
		int32 index = 1;
		reserved 2;
		float value = 3;
		float respawn_time = 4;
		bool removed = 5;
		float spawn_time = 6;
	}
	
	repeated Instance instances = 1;
	reserved 2;
	int32 total_num_instances = 3;
	float spawn_time = 4;
	TimeOffset time_offset = 5;
}

message FoliageQualityManager
{
	int32 level_seed = 1;
}

message FoliageTileParameters
{
	message FoliageBoostInstance
	{
		string foliage_component = 1;
		float boost = 2;
	}

	repeated FoliageBoostInstance respawn_boosts = 1;
}
