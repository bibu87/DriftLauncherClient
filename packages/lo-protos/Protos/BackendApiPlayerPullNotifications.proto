syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Backend.Web.Protos";
package MistProto;

enum BackendApiPlayerCharacterNotificationType 
{
	ClanInvite = 0;
}

message BackendApiPlayerCharacterClanInviteNotification 
{
	string clan = 1;
}

message BackendApiPlayerPullNotificationsRequest
{
	uint64 notifications_version = 1;
}

message BackendApiPlayerPullNotificationsResponse
{
	uint64 notifications_version = 1;
	repeated BackendApiPlayerCharacterClanInviteNotification clan_invites = 2;
	// Indicates that any clan invite has been cancelled.
	bool clan_invite_cancelled = 3;
}