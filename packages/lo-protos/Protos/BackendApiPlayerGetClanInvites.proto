syntax = "proto3";
option cc_enable_arenas = true;
option csharp_namespace = "DonkeyCrew.Oasis.Backend.Web.Protos";
import "BackendApiCommon.proto";
package MistProto;

message BackendApiPlayerGetClanInvitesRequest
{
}

message BackendApiPlayerGetClanInvitesResponse
{
	message BackendApiPlayerClanInvite
	{
		int64 invite_id = 1;
		int64 clan_id = 2;
		string clan_name = 3;
		int64 inviter_character_id = 4;
		string inviter_character_name = 5;
		string inviter_account_name = 6;
		BackendApiGamePlatform inviter_account_platform = 7;
		string inviter_account_uniquenetid = 8;
	}
	
	repeated BackendApiPlayerClanInvite invites = 1;
	int64 join_cooldown_date = 2;
}
