components:
  schemas:
    googleprotobufAny:
      type: object
      description: Arbitrary protobuf message (google.protobuf.Any)
      properties:
        '@type':
          type: string
          description: A URL/resource name that uniquely identifies the type
      additionalProperties: true
    Actor:
      type: object
      properties:
        version:
          type: integer
          format: int32
        classData:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ActorClassData'
        guid:
          type: string
        path:
          type: string
        classPath:
          type: string
        transform:
          $ref: '#/components/schemas/Transform'
        simpleAttachment:
          $ref: '#/components/schemas/ActorSimpleAttachment'
        childActorAttachment:
          $ref: '#/components/schemas/ActorChildActorAttachment'
        components:
          type: array
          items:
            $ref: '#/components/schemas/Component'
        remainingLifeSpan:
          type: number
          format: float
    ActorSimpleAttachment:
      type: object
      properties:
        actorGuid:
          type: string
        componentName:
          type: string
        socketName:
          type: string
    ActorChildActorAttachment:
      type: object
      properties:
        actorGuid:
          type: string
        componentName:
          type: string
    ActorClassData:
      type: object
      properties:
        version:
          type: integer
          format: int32
        data:
          $ref: '#/components/schemas/googleprotobufAny'
    ActorAttachment:
      type: object
      properties:
        itemIndex:
          type: integer
          format: int32
        dropOnDestroy:
          type: boolean
    ActorArray:
      type: object
      properties:
        actors:
          type: array
          items:
            $ref: '#/components/schemas/Actor'
    Color:
      type: object
      properties:
        r:
          type: number
          format: float
        g:
          type: number
          format: float
        b:
          type: number
          format: float
        a:
          type: number
          format: float
    Vector:
      type: object
      properties:
        x:
          type: number
          format: float
        y:
          type: number
          format: float
        z:
          type: number
          format: float
    Vector2D:
      type: object
      properties:
        x:
          type: number
          format: float
        y:
          type: number
          format: float
    IntVector2D:
      type: object
      properties:
        x:
          type: integer
          format: int32
        y:
          type: integer
          format: int32
    Rotator:
      type: object
      properties:
        pitch:
          type: number
          format: float
        yaw:
          type: number
          format: float
        roll:
          type: number
          format: float
    Quat:
      type: object
      properties:
        x:
          type: number
          format: float
        y:
          type: number
          format: float
        z:
          type: number
          format: float
        w:
          type: number
          format: float
    Transform:
      type: object
      properties:
        rotation:
          $ref: '#/components/schemas/Quat'
        translation:
          $ref: '#/components/schemas/Vector'
        scale:
          $ref: '#/components/schemas/Vector'
    BoundingBox:
      type: object
      properties:
        min:
          $ref: '#/components/schemas/Vector'
        max:
          $ref: '#/components/schemas/Vector'
    String:
      type: object
      properties:
        text:
          type: string
    Component:
      type: object
      properties:
        version:
          type: integer
          format: int32
        classData:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ComponentClassData'
        guid:
          type: string
        name:
          type: string
        classPath:
          type: string
        replicated:
          type: boolean
        createdAtRuntime:
          type: boolean
    ComponentClassData:
      type: object
      properties:
        version:
          type: integer
          format: int32
        data:
          $ref: '#/components/schemas/googleprotobufAny'
    ArtificialTradeOrderManager:
